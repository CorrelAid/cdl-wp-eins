name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Fails fast, before the build
      - name: toc.json <-> snippets
        run: bun run check:site --only=snippets

      # Pull requests from forks get no secrets; the build still passes without Zotero,
      # and the link check then skips the /quellen anchors.
      - name: Build
        run: bun run build
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY || 'unset' }}
          ZOTERO_GROUP_ID: ${{ secrets.ZOTERO_GROUP_ID || '0' }}

      - name: Internal links in dist/
        run: bun run check:site --only=links
